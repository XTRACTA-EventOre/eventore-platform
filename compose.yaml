services:
  identity-db:
    image: mysql:8.4
    command: ["--default-time-zone=+00:00", "--innodb-buffer-pool-size=64M"]
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_USER: identity
      MYSQL_PASSWORD: ${IDENTITY_DB_PASSWORD:?set IDENTITY_DB_PASSWORD}
      MYSQL_DATABASE: identity
    volumes: [identity-mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -u identity -D identity -e "SELECT 1"']
      interval: 5s
      retries: 30
      timeout: 5s
      start_period: 20s
  traceability-db:
    image: mysql:8.4
    command: ["--default-time-zone=+00:00", "--innodb-buffer-pool-size=64M"]
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_USER: traceability
      MYSQL_PASSWORD: ${TRACEABILITY_DB_PASSWORD:?set TRACEABILITY_DB_PASSWORD}
      MYSQL_DATABASE: traceability
    volumes: [traceability-mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -u traceability -D traceability -e "SELECT 1"']
      interval: 5s
      retries: 30
      timeout: 5s
      start_period: 20s
  logistics-db:
    image: mysql:8.4
    command: ["--default-time-zone=+00:00", "--innodb-buffer-pool-size=64M"]
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_USER: logistics
      MYSQL_PASSWORD: ${LOGISTICS_DB_PASSWORD:?set LOGISTICS_DB_PASSWORD}
      MYSQL_DATABASE: logistics
    volumes: [logistics-mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -u logistics -D logistics -e "SELECT 1"']
      interval: 5s
      retries: 30
      timeout: 5s
      start_period: 20s
  logistics-migrate:
    build: { context: ., dockerfile: Dockerfile }
    command: ["node", "scripts/migrate-service.js", "logistics"]
    environment:
      DATABASE_URL: mysql://logistics:${LOGISTICS_DB_PASSWORD}@logistics-db:3306/logistics
    depends_on:
      logistics-db: { condition: service_healthy }
  processing-db:
    image: mysql:8.4
    command: ["--default-time-zone=+00:00", "--innodb-buffer-pool-size=64M"]
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_USER: processing
      MYSQL_PASSWORD: ${PROCESSING_DB_PASSWORD:?set PROCESSING_DB_PASSWORD}
      MYSQL_DATABASE: processing
    volumes: [processing-mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -u processing -D processing -e "SELECT 1"']
      interval: 5s
      retries: 30
      timeout: 5s
      start_period: 20s
  processing-migrate:
    build: { context: ., dockerfile: Dockerfile }
    command: ["node", "scripts/migrate-service.js", "processing"]
    environment:
      DATABASE_URL: mysql://processing:${PROCESSING_DB_PASSWORD}@processing-db:3306/processing
    depends_on:
      processing-db: { condition: service_healthy }
  jewelry-db:
    image: mysql:8.4
    command: ["--default-time-zone=+00:00", "--innodb-buffer-pool-size=64M"]
    environment:
