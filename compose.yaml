services:
  identity-db:
    image: mysql:8.4
    command: ["--default-time-zone=+00:00"]
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_USER: identity
      MYSQL_PASSWORD: ${IDENTITY_DB_PASSWORD:?set IDENTITY_DB_PASSWORD}
      MYSQL_DATABASE: identity
    volumes: [identity-mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -u identity -D identity -e "SELECT 1"']
      interval: 5s
      retries: 30
      timeout: 5s
      start_period: 20s
  traceability-db:
    image: mysql:8.4
    command: ["--default-time-zone=+00:00"]
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_USER: traceability
      MYSQL_PASSWORD: ${TRACEABILITY_DB_PASSWORD:?set TRACEABILITY_DB_PASSWORD}
      MYSQL_DATABASE: traceability
    volumes: [traceability-mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -u traceability -D traceability -e "SELECT 1"']
      interval: 5s
      retries: 30
      timeout: 5s
      start_period: 20s
  identity-migrate:
    build: { context: ., dockerfile: Dockerfile }
    command: ["node", "scripts/migrate-service.js", "identity"]
    environment:
      DATABASE_URL: mysql://identity:${IDENTITY_DB_PASSWORD}@identity-db:3306/identity
    depends_on:
      identity-db: { condition: service_healthy }
  traceability-migrate:
    build: { context: ., dockerfile: Dockerfile }
    command: ["node", "scripts/migrate-service.js", "traceability"]
    environment:
      DATABASE_URL: mysql://traceability:${TRACEABILITY_DB_PASSWORD}@traceability-db:3306/traceability
    depends_on:
      traceability-db: { condition: service_healthy }
  identity:
    build: { context: ., dockerfile: Dockerfile }
    command: ["node", "src/services/identity/server.js"]
    environment:
      DATABASE_URL: mysql://identity:${IDENTITY_DB_PASSWORD}@identity-db:3306/identity
      INTERNAL_AUTH_SECRET: ${INTERNAL_AUTH_SECRET:?set INTERNAL_AUTH_SECRET}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}
      PORT: 3001
    depends_on:
      identity-migrate: { condition: service_completed_successfully }
  traceability:
    build: { context: ., dockerfile: Dockerfile }
    command: ["node", "src/services/traceability/server.js"]
    environment:
      DATABASE_URL: mysql://traceability:${TRACEABILITY_DB_PASSWORD}@traceability-db:3306/traceability
      IDENTITY_URL: http://identity:3001
      INTERNAL_AUTH_SECRET: ${INTERNAL_AUTH_SECRET:?set INTERNAL_AUTH_SECRET}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}
      PORT: 3002
    depends_on:
      traceability-migrate: { condition: service_completed_successfully }
      identity: { condition: service_started }
  gateway:
    build: { context: ., dockerfile: Dockerfile }
    command: ["node", "src/services/gateway/server.js"]
    environment:
      IDENTITY_URL: http://identity:3001
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}
      TRACEABILITY_URL: http://traceability:3002
      PORT: 3000
    ports: ["3000:3000"]
    depends_on:
      identity: { condition: service_started }
      traceability: { condition: service_started }
volumes:
  identity-mysql-data:
  traceability-mysql-data:
