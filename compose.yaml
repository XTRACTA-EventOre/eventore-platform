  jewelry:
    build: { context: ., dockerfile: Dockerfile }
    command: ["node", "src/services/jewelry/server.js"]
    environment:
      DATABASE_URL: mysql://jewelry:${JEWELRY_DB_PASSWORD}@jewelry-db:3306/jewelry
      IDENTITY_URL: http://identity:3001
      TRACEABILITY_URL: http://traceability:3002
      JEWELRY_URL: http://jewelry:3005
      INTERNAL_AUTH_SECRET: ${INTERNAL_AUTH_SECRET:?set INTERNAL_AUTH_SECRET}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}
      PORT: 3005
    depends_on:
      jewelry-migrate: { condition: service_completed_successfully }
      traceability: { condition: service_started }
