name: Microservices acceptance
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compose-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      IDENTITY_DB_PASSWORD: local-ci-identity-password
      JEWELRY_DB_PASSWORD: local-ci-jewelry-password
      CERTIFICATION_DB_PASSWORD: local-ci-certification-password
      DEVICES_DB_PASSWORD: local-ci-devices-password
      REPORTING_DB_PASSWORD: local-ci-reporting-password
      PROCESSING_DB_PASSWORD: local-ci-processing-password
      LOGISTICS_DB_PASSWORD: local-ci-logistics-password
      TRACEABILITY_DB_PASSWORD: local-ci-traceability-password
      INTERNAL_AUTH_SECRET: local-ci-long-shared-secret-change-in-production
      APP_BASE_URL: http://localhost:5173
      API_BASE_URL: http://localhost:3000
      SMOKE_PASSWORD: Sprint2-smoke-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate editable C4 model
        run: >-
          docker run --rm -v "$PWD/docs/architecture:/usr/local/structurizr:ro"
          structurizr/cli@sha256:717e320e0ad52335ea9939bf5fae092620cc3deccecf6f280a5b6fee99763c53
          validate -workspace /usr/local/structurizr/workspace.dsl
      - name: Validate cloud Compose variants without provisioning resources
        env:
          PUBLIC_HOST: eventore.example.test
          FRONTEND_REF: 0de802d648d3114299eabe678d05dd978c8dc332
          ORIGIN_SECRET: local-ci-origin-header-only
        run: |
          docker compose -f compose.yaml -f compose.cloud.yaml config --quiet
          docker compose -f compose.yaml -f compose.aws.yaml config --quiet
          docker compose -f compose.yaml -f compose.aws.yaml build web
          docker compose -f compose.yaml -f compose.aws.yaml run --rm --no-deps web caddy validate --config /etc/caddy/Caddyfile
      - run: docker compose up -d --build
      - run: docker compose exec -T -e BOOTSTRAP_PASSWORD=$SMOKE_PASSWORD identity node scripts/create-user.js smoke@example.test 11111111-1111-4111-8111-111111111111
      - run: node scripts/smoke-microservices.js
      - run: docker compose exec -T -e BOOTSTRAP_PASSWORD=$SMOKE_PASSWORD identity node scripts/create-user.js admin-smoke@example.test 11111111-1111-4111-8111-111111111111 Administrator
      - run: docker compose exec -T -e BOOTSTRAP_PASSWORD=$SMOKE_PASSWORD identity node scripts/create-user.js carrier-smoke@example.test 11111111-1111-4111-8111-111111111111 Transporter
      - run: node scripts/smoke-sprint2.js
      - run: docker compose exec -T -e BOOTSTRAP_PASSWORD=$SMOKE_PASSWORD identity node scripts/create-user.js plant-smoke@example.test 11111111-1111-4111-8111-111111111111 PlantOperator
      - run: docker compose exec -T -e BOOTSTRAP_PASSWORD=$SMOKE_PASSWORD identity node scripts/create-user.js jeweler-smoke@example.test 11111111-1111-4111-8111-111111111111 Jeweler
      - run: docker compose exec -T -e BOOTSTRAP_PASSWORD=$SMOKE_PASSWORD identity node scripts/create-user.js certifier-smoke@example.test 11111111-1111-4111-8111-111111111111 Certifier
      - run: mkdir -p test-results
      - run: >-
          docker run --rm --network host --user "$(id -u):$(id -g)"
          -v "$PWD/docs/postman:/etc/newman:ro" -v "$PWD/test-results:/reports"
          postman/newman@sha256:d9b5e780ead0026bbb37f3759cd7b10fc8a88cd4030c8266a7c5e343d75a5198
          run avance4.postman_collection.json --env-var baseUrl=http://127.0.0.1:3000
          --env-var password="$SMOKE_PASSWORD" --reporters cli,junit
          --reporter-junit-export /reports/postman.xml
      - if: always()
        run: docker compose logs --no-color --tail=100
      - if: always()
        run: docker compose down --volumes
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postman-evidence
          path: test-results/postman.xml
          if-no-files-found: ignore
