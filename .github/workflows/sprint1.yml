name: Backend regression
on:
  pull_request:
  push:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_HOST: "%"
          MYSQL_ROOT_PASSWORD: test-only-password
          MYSQL_DATABASE: eventore_test
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ptest-only-password --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 20s
    env:
      DATABASE_URL: mysql://root:test-only-password@localhost:3306/eventore_test
      TEST_DATABASE_URL: mysql://root:test-only-password@localhost:3306/eventore_test
      APP_BASE_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run migrate
      - run: npm run migrate
