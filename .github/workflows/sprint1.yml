name: Backend regression
on:
  pull_request:
  push:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eventore
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: eventore_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U eventore -d eventore_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://eventore:test-only-password@localhost:5432/eventore_test
      TEST_DATABASE_URL: postgres://eventore:test-only-password@localhost:5432/eventore_test
      APP_BASE_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run migrate
      - run: npm run migrate
