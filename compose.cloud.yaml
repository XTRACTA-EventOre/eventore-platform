# Overlay for an approved existing VM and a domain whose DNS points to it.
services:
  identity:
    environment:
      NODE_ENV: production
  web:
    build:
      context: .
      dockerfile: infra/cloud/Dockerfile.web
      args:
        FRONTEND_REF: ${FRONTEND_REF:?set reviewed frontend commit SHA}
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?set public DNS hostname}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes: [caddy-data:/data, caddy-config:/config]
    depends_on:
      gateway: {condition: service_started}
    restart: unless-stopped
volumes:
  caddy-data:
  caddy-config:
